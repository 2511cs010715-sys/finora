# FinVerse Spring Boot Application Configuration
spring.application.name=finverse-backend
server.port=8080

# Database Configuration (Primary: H2 for zero-config instant start, configurable for MySQL)
# To switch to MySQL, set spring.profiles.active=mysql or uncomment MySQL properties below
spring.datasource.url=jdbc:h2:mem:finverse_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Configuration
finverse.app.jwtSecret=FinVerseSecureSecretKeyForJWTAuthentication2026BTechProjectPlatform
finverse.app.jwtExpirationMs=86400000

# Python ML Microservice REST Client Configuration
finverse.ml.service.url=http://localhost:5000
