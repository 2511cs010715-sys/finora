# Smart Savings & Investment Planner Spring Boot Configuration
spring.application.name=smart-savings-planner-backend
server.port=8080

# Database Configuration (Default H2 in-memory for instant out-of-the-box zero setup)
spring.datasource.url=jdbc:h2:mem:smart_savings_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Settings
smartplanner.app.jwtSecret=SmartSavingsAndInvestmentPlannerSecretKeyJWTAuthentication2026BTechProject
smartplanner.app.jwtExpirationMs=86400000

# Python AI Advisory Microservice REST Client Configuration
smartplanner.ai.service.url=http://localhost:5001
